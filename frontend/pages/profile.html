<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Image Editor - Quản lý tài khoản</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: {} }
        }
    </script>
    <style>
        .glass-dark { background-color: rgba(0, 0, 0, 0.3); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen relative overflow-hidden">
    <!-- Navbar -->
    <nav class="glass-dark border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="../index.html" class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                        <i class="fas fa-image mr-2"></i>WebImageEditor
                    </a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="../index.html" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium transition-colors">Về Editor</a>
                    <a href="login.html" class="text-red-400 hover:text-red-300 px-3 py-2 rounded-md text-sm font-medium transition-colors"><i class="fas fa-sign-out-alt mr-1"></i> Đăng xuất</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Background Decor -->
    <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-purple-900/20 rounded-full mix-blend-multiply filter blur-3xl"></div>
    <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-blue-900/20 rounded-full mix-blend-multiply filter blur-3xl"></div>

    <div class="max-w-4xl mx-auto px-4 py-12 relative z-10">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Sidebar Profile -->
            <div class="col-span-1">
                <div class="glass-dark rounded-2xl p-6 text-center shadow-xl">
                    <div class="relative w-32 h-32 mx-auto mb-4">
                        <img src="https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff&size=128" alt="Avatar" class="rounded-full shadow-lg border-4 border-gray-700">
                        <button class="absolute bottom-0 right-0 bg-blue-600 hover:bg-blue-500 text-white p-2 rounded-full shadow-lg transition-colors">
                            <i class="fas fa-camera"></i>
                        </button>
                    </div>
                    <h2 class="text-xl font-bold text-white">Người Dùng 1</h2>
                    <p class="text-gray-400 text-sm mb-6">Thành viên từ Thg 9, 2026</p>
                    
                    <div class="flex flex-col space-y-2">
                        <button class="w-full text-left px-4 py-2 rounded-lg bg-gray-800 text-white font-medium"><i class="fas fa-user mr-3"></i> Hồ sơ</button>
                        <button class="w-full text-left px-4 py-2 rounded-lg text-gray-400 hover:bg-gray-800/50 hover:text-white transition-colors"><i class="fas fa-history mr-3"></i> Lịch sử chỉnh sửa</button>
                        <button class="w-full text-left px-4 py-2 rounded-lg text-gray-400 hover:bg-gray-800/50 hover:text-white transition-colors"><i class="fas fa-cog mr-3"></i> Cài đặt</button>
                    </div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-span-1 md:col-span-2 space-y-6">
                <!-- Update Info Form -->
                <div class="glass-dark rounded-2xl p-8 shadow-xl">
                    <h3 class="text-xl font-bold text-white mb-6 border-b border-gray-700 pb-2">Thông Tin Cá Nhân</h3>
                    <form class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-2">Tên hiển thị</label>
                                <input type="text" class="w-full px-4 py-2.5 bg-gray-800/50 border border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-white" value="Người Dùng 1">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                                <input type="email" class="w-full px-4 py-2.5 bg-gray-800/50 border border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-gray-400" value="user@example.com" disabled>
                                <p class="text-xs text-gray-500 mt-1">Không thể thay đổi email.</p>
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-300 mb-2">Tiểu sử</label>
                            <textarea class="w-full px-4 py-2.5 bg-gray-800/50 border border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-white h-24 resize-none" placeholder="Viết gì đó về bạn..."></textarea>
                        </div>
                        <div class="flex justify-end">
                            <button type="button" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 rounded-xl font-medium text-white shadow-lg transition-colors">
                                Lưu Thay Đổi
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Recent Edits (Empty State) -->
                <div class="glass-dark rounded-2xl p-8 shadow-xl">
                    <h3 class="text-xl font-bold text-white mb-6 border-b border-gray-700 pb-2">Lịch Sử Gần Đây</h3>
                    <div class="text-center py-10">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gray-800 text-gray-500 mb-4">
                            <i class="fas fa-images text-2xl"></i>
                        </div>
                        <p class="text-gray-400">Bạn chưa có lịch sử chỉnh sửa nào.</p>
                        <a href="../index.html" class="inline-block mt-4 text-blue-400 hover:text-blue-300 font-medium">Bắt đầu chỉnh sửa ngay <i class="fas fa-arrow-right ml-1"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
