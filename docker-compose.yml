version: '4.92'

services:
  mongo:
    image: mongo:latest
    container_name: mongodb_editor
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: flask_backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/

  frontend:
    build: ./frontend
    container_name: nginx_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo_data: